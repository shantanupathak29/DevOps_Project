name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Continuous Integration (CI)
  # ==========================================
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run code linter
        run: npm --prefix frontend run lint

      - name: Build frontend application
        run: npm --prefix frontend run build

      - name: Archive production build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # 2. Continuous Deployment (CD)
  # ==========================================
  cd:
    name: Deploy Application (CD)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Verify build artifact
        run: |
          echo "Deployment artifact verified:"
          ls -la dist

      - name: Deploy step
        run: |
          echo "Successfully completed Continuous Deployment pipeline!"
          # You can connect your target hosting provider here (e.g. Vercel, Netlify, AWS S3, or GitHub Pages).
