<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusRide — Login</title>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #1e293b;
      --bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 40px 8%;
      background-color: var(--bg);
      overflow: hidden;
    }

    /* Fullscreen Background Video */
    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -2;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.65) contrast(1.05);
    }

    /* Overlay for contrast */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.75) 0%, rgba(37, 99, 235, 0.25) 100%);
      z-index: -1;
    }

    /* Glassmorphism Portal Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
      z-index: 1;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo-icon {
      font-size: 38px;
    }

    .title h2 {
      color: #0f172a;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title p {
      color: #475569;
      font-size: 14px;
      margin-bottom: 26px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      background: #ffffff;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-student {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-student:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn-driver {
      background: #334155;
      color: white;
    }

    .btn-driver:hover {
      background: #0f172a;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      body {
        justify-content: center;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Fullscreen Video Background -->
  <video autoplay loop muted playsinline class="bg-video">
    <source src="{{ url_for('static', filename='videos/campus_background.mp4') }}" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  <div class="video-overlay"></div>

  <div class="card">
    <div class="logo-container">
      <span class="logo-icon">🚌</span>
      <div class="title">
        <h2>CampusRide</h2>
      </div>
    </div>
    <div class="title">
      <p>Smart Bus Seat Availability & Allocation</p>
    </div>

    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">User ID / Student ID / Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. STU1024 or DRIVER01" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="btn-group">
        <button type="submit" name="role" value="student" class="btn btn-student">Student Login</button>
        <button type="submit" name="role" value="driver" class="btn btn-driver">Driver Login</button>
      </div>
    </form>
  </div>
</body>

</html>
